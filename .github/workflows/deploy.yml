name: Deploy M-ABLE to GitHub Pages

# Publishes the web app in web/ to https://okuhle-creator.github.io/M-ABLE/.
# MediaPipe models are committed in web/public/vendor/; the Python pipeline does
# not run here. Retrain locally (see the README) and commit the ONNX export.
#
# Trigger: any push to the m-able/development branch, or a manual dispatch.
# The build runs the full unit-test gate before uploading the artifact.

on:
  push:
    branches:
      - m-able/development
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build M-ABLE
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run format:check && npm run lint

      - name: Unit tests
        run: npm test

      - name: Build production application
        run: npm run build

      - name: Verify no test hooks in production build
        run: '! grep -rl "__gesturesignTest" dist'

      - name: Verify only plain WASM runtime ships (no WebGPU / JSEP builds)
        run: '! find dist -iname "*jsep*" -o -iname "*asyncify*" -o -iname "*webgpu*" | grep .'

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: web/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
