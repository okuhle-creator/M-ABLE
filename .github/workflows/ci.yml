name: CI

on:
  push:
    branches: [main, m-able/development]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Pipeline (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bd01503ad93eab1f7947b66b4fc3c90d3d41a7e9 # v6.3.1
        with:
          working-directory: pipeline
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Typecheck
        run: uv run mypy
      - name: Test (includes the feature-parity fixture)
        run: uv run pytest
      - name: Smoke run (synthetic data -> prepare -> train -> evaluate -> ONNX export)
        run: uv run gesturesign smoke
      - name: Audit dependencies
        run: uv run pip-audit --skip-editable

  web:
    name: Web (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run format:check && npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (includes the feature-parity fixture)
        run: npm test
      - name: Build (fetches MediaPipe models and checks their SHA-256)
        run: npm run build
      - name: The production build has no test hook
        run: '! grep -rl "__gesturesignTest" dist'
      - name: The production build ships only the WebAssembly runtime (no WebGPU or JSEP build)
        run: '! find dist -iname "*jsep*" -o -iname "*asyncify*" -o -iname "*webgpu*" | grep .'
      - name: End-to-end tests
        run: npx playwright install --with-deps chromium && npm run test:e2e
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
